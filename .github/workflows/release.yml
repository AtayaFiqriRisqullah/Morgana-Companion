name: Build & Release (Windows, Linux & Android)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Windows executable
        run: |
          pyinstaller --noconfirm --clean MorganaCompanion.spec

      - name: Package Windows archive
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ inputs.tag }}" }
          $zip = "dist/Morgana-Companion-$tag-win64.zip"
          Compress-Archive -Path "dist/Morgana Companion" -DestinationPath $zip -Force
          echo "ARCHIVE=$zip" >> $env:GITHUB_ENV

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-win64
          path: ${{ env.ARCHIVE }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt6 system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxcb-cursor0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Linux executable
        run: |
          pyinstaller --noconfirm --clean MorganaCompanion.spec

      - name: Package Linux archive
        run: |
          TAG=$([ "${{ github.ref_type }}" = "tag" ] && echo "${{ github.ref_name }}" || echo "${{ inputs.tag }}")
          TAR="dist/Morgana-Companion-${TAG}-linux-x64.tar.gz"
          tar -czf "$TAR" -C dist "Morgana Companion"
          echo "ARCHIVE=$TAR" >> "$GITHUB_ENV"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: ${{ env.ARCHIVE }}

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies & verify
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build Android release APK
        working-directory: mobile
        run: |
          flutter build apk --release

      - name: Package Android APK
        run: |
          TAG=$([ "${{ github.ref_type }}" = "tag" ] && echo "${{ github.ref_name }}" || echo "${{ inputs.tag }}")
          mkdir -p dist
          APK="dist/Morgana-Companion-${TAG}-android.apk"
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "$APK"
          echo "ARCHIVE=$APK" >> "$GITHUB_ENV"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: ${{ env.ARCHIVE }}

  publish-release:
    needs: [build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$([ "${{ github.ref_type }}" = "tag" ] && echo "${{ github.ref_name }}" || echo "${{ inputs.tag }}")
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            for attempt in 1 2 3; do
              if gh release create "$TAG" \
                --title "Morgana Companion $TAG" \
                --generate-notes; then
                break
              fi
              echo "Create release failed (attempt $attempt/3); retrying in $((attempt * 5))s..."
              sleep $((attempt * 5))
            done
          fi

          FAILED=0
          for asset in release-assets/*; do
            name=$(basename "$asset")
            uploaded=0
            for attempt in 1 2 3 4 5; do
              echo "Uploading $name (attempt $attempt/5)..."
              starter_ids=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" 2>/dev/null \
                | jq -r --arg name "$name" '.assets[]? | select(.name == $name and .state == "starter") | .id' || true)
              for sid in $starter_ids; do
                echo "Deleting zombie starter asset $sid for $name..."
                gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$sid" || true
              done

              if gh release upload "$TAG" "$asset" --clobber; then
                uploaded=1
                break
              fi
              echo "Upload of $name failed on attempt $attempt; retrying in $((attempt * 5))s..."
              sleep $((attempt * 5))
            done

            if [ "$uploaded" -ne 1 ]; then
              echo "::error::Failed to upload $name after 5 attempts"
              FAILED=1
            fi
          done

          exit "$FAILED"
