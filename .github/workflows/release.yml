name: Build & Release Windows Executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --noconfirm --clean MorganaCompanion.spec

      - name: Package release archive
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ inputs.tag }}" }
          $zip = "dist/Morgana-Companion-$tag-win64.zip"
          Compress-Archive -Path "dist/Morgana Companion" -DestinationPath $zip -Force
          echo "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          echo "RELEASE_ZIP=$zip" >> $env:GITHUB_ENV

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exists = gh release view "$env:RELEASE_TAG" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" "$env:RELEASE_ZIP" --clobber
          } else {
            gh release create "$env:RELEASE_TAG" "$env:RELEASE_ZIP" --title "Morgana Companion $env:RELEASE_TAG" --generate-notes
          }
